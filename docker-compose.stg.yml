services:
  admin:
    container_name: heyvoca_admin_stg
    image: heyvoca_admin:stg
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env.stg
    networks:
      - heyvoca_stg_heyvoca_stg
      - nginx_proxy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

networks:
  heyvoca_stg_heyvoca_stg:
    external: true
  nginx_proxy:
    external: true
